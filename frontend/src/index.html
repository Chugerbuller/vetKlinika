<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <title>Клиенты ветклиники</title>

        <link rel="stylesheet" href="styles.css" />

        <link rel="stylesheet" href="/bootstrap/bootstrap.min.css" />
    </head>

    <body>
        <div class="app-container">
            <header class="header">
                <div class="top-bar">
                    <h2 class="title">Клиенты</h2>

                    <button id="addClientBtn" class="btn btn-primary add-btn">

                <input
                    id="searchInput"
                    type="text"
                    class="form-control search"
                    placeholder="Поиск клиента..."
                />
            </header>

            <div id="clientsList" class="clients-list"></div>
        </div>

        <script src="main.js"></script>
    </body>
</html>
