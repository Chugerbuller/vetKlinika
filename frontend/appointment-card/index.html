<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Прием у ветеринара</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="/bootstrap/bootstrap.min.css">
</head>

<body>
    <div class="page-container">

        <div class="header-bar">
            <button id="backBtn" class="btn btn-outline-secondary">← Назад к питомцу</button>

            <div class="header-actions">
                <h4 id="visitDate" class="visit-date">Загрузка даты...</h4>
                <button id="editVisitBtn" class="btn btn-outline-primary edit-visit-btn">
                    ✎ Редактировать
                </button>
            </div>
        </div>

        <div class="top-section">
            <!-- Левый верхний угол: Инфо о животном -->
            <div class="pet-info-card">
                <h5 class="card-title">Пациент</h5>
                <div id="petInfoBlock">
                    <!-- Заполняется через JS -->
                </div>
            </div>

            <!-- Справа: Анамнез и Аллергии -->
            <div class="right-section">
                <div class="anamnesis-card">
                    <h5 class="card-title">Анамнез (на момент приема)</h5>
                    <div id="visitAnamnesis" class="text-content"></div>
                </div>

                <div class="allergy-card">
                    <h6 class="card-title text-danger">Аллергии</h6>
                    <div id="petAllergies"></div>
                </div>
            </div>
        </div>

        <!-- Внизу: Диагноз, Лечение, Рекомендации -->
        <div class="bottom-section">
            <h4 class="section-title">Медицинское заключение</h4>

            <div class="diagnosis-grid">
                <div class="diagnosis-card">
                    <h6 class="card-title">Заболевание / Диагноз</h6>
                    <div id="visitDisease" class="text-content"></div>
                </div>

                <div class="diagnosis-card">
                    <h6 class="card-title">Лечение</h6>
                    <div id="visitTreatment" class="text-content"></div>
                </div>

                <div class="diagnosis-card">
                    <h6 class="card-title">Рекомендации</h6>
                    <div id="visitRecommendations" class="text-content"></div>
                </div>

                <div class="diagnosis-card">
                    <h6 class="card-title">Прикрепленные файлы (Анализы, УЗИ и т.д.)</h6>
                    <div id="visitFiles" class="files-container">
                        <span class="text-content text-muted">Нет прикрепленных файлов</span>
                    </div>
                    <h6 class="card-title"
                        style="font-size: 14px; color: #6c757d; border-bottom: none; margin-bottom: 10px;">Добавить
                        новый документ</h6>
                    <div id="dropZone" class="drop-zone">
                        <span class="drop-zone-prompt">Перетащите файл сюда или выберите через кнопку</span>
                        <div class="input-group mt-2">
                            <input type="file" class="form-control" id="fileInput" aria-describedby="uploadBtn">
                            <button class="btn btn-success" type="button" id="uploadBtn">Загрузить</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно редактирования приема -->
    <div id="editVisitModal" class="visit-modal hidden">
        <div class="visit-window">
            <h5 class="visit-window-title">Редактирование приема</h5>

            <div class="mb-3">
                <label for="editVisitDate" class="small text-muted mb-1">Дата приема</label>
                <input id="editVisitDate" type="date" class="form-control">
            </div>

            <div class="mb-3">
                <label for="editVisitAnamnesis" class="small text-muted mb-1">Анамнез</label>
                <textarea id="editVisitAnamnesis" class="form-control" rows="3"></textarea>
            </div>

            <div class="mb-3">
                <label for="editVisitDisease" class="small text-muted mb-1">Заболевание / Диагноз</label>
                <textarea id="editVisitDisease" class="form-control" rows="2"></textarea>
            </div>

            <div class="mb-3">
                <label for="editVisitTreatment" class="small text-muted mb-1">Лечение</label>
                <textarea id="editVisitTreatment" class="form-control" rows="3"></textarea>
            </div>

            <div class="mb-3">
                <label for="editVisitRecommendations" class="small text-muted mb-1">Рекомендации</label>
                <textarea id="editVisitRecommendations" class="form-control" rows="3"></textarea>
            </div>

            <div class="visit-window-buttons">
                <button id="saveVisitBtn" class="btn btn-primary w-100">Сохранить</button>
                <button id="closeVisitModalBtn" class="btn btn-light w-100">Отмена</button>
            </div>
        </div>
    </div>

    <script src="appointment.js"></script>
</body>

</html>
