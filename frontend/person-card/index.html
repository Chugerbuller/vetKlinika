<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Карточка клиента</title>

    <link rel="stylesheet" href="styles.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

    <div class="container-box">

        <button id="backBtn" class="btn btn-outline-secondary back-btn">
            ← Назад к поиску
        </button>

        <div id="personCard" class="person-card"></div>

        <div class="animals-header">

            <h4>Животные клиента</h4>

            <button id="addAnimalBtn" class="add-animal-card-btn">
                Добавить животное
            </button>

            <div id="animalModal" class="animal-modal hidden">
                <div class="animal-window">
                    <h5>Новый питомец</h5>

                    <div class="form-group">
                        <label class="small text-muted mb-1">Кличка</label>
                        <input id="animalName" class="form-control" placeholder="Например, Барсик">
                    </div>

                    <div class="row">
                        <div class="col-6">
                            <label class="small text-muted mb-1">Вес (кг)</label>
                            <input id="animalWeight" class="form-control" placeholder="5.2">
                        </div>
                        <div class="col-6">
                            <label class="small text-muted mb-1">Возраст</label>
                            <input id="animalAge" class="form-control" placeholder="3">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="small text-muted mb-1">Вид животного</label>
                        <select id="animalType" class="form-control"></select>
                    </div>

                    <div id="newTypeBlock" class="hidden">
                        <label class="small text-muted mb-1">Укажите свой вариант</label>
                        <input id="newTypeInput" class="form-control" placeholder="Например, Енот">
                    </div>

                    <div class="buttons mt-3">
                        <button id="saveAnimalBtn" class="btn btn-primary w-100">
                            Сохранить запись
                        </button>
                        <button id="closeAnimalBtn" class="btn btn-light w-100">
                            Отмена
                        </button>
                    </div>
                </div>
            </div>

        </div>

        <div id="animalsList" class="animals-list"></div>

    </div>

    <script src="person.js"></script>

</body>

</html>
