<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Карточка клиента</title>

    <link rel="stylesheet" href="styles.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

    <div class="container-box">

        <button id="backBtn" class="btn btn-outline-secondary back-btn">
            ← Назад к поиску
        </button>

        <div id="personCard" class="person-card"></div>

        <div class="animals-header">

            <h4>Животные клиента</h4>

            <button id="addAnimalBtn" class="btn btn-primary">
                Добавить животное
            </button>

            <div id="animalModal" class="animal-modal hidden">

                <div class="animal-window">

                    <h5>Добавить животное</h5>

                    <input id="animalName" class="form-control mb-2" placeholder="Имя">

                    <input id="animalWeight" class="form-control mb-2" placeholder="Вес">

                    <input id="animalAge" class="form-control mb-2" placeholder="Возраст">

                    <select id="animalType" class="form-control mb-2"></select>

                    <div id="newTypeBlock" class="hidden">
                        <input id="newTypeInput" class="form-control mb-2" placeholder="Введите тип">
                    </div>

                    <textarea id="animalAnamnesis" class="form-control mb-2" placeholder="Анамнез"></textarea>

                    <div class="buttons">

                        <button id="saveAnimalBtn" class="btn btn-success">
                            Создать
                        </button>

                        <button id="closeAnimalBtn" class="btn btn-secondary">
                            Отмена
                        </button>

                    </div>

                </div>
            </div>

        </div>

        <div id="animalsList" class="animals-list"></div>

    </div>

    <script src="app.js"></script>

</body>

</html>
